name: Deploy Eventhouse Schemas and Agents

on:
  push:
    branches:
      - main
    paths:
      - 'sentinel_mesh_v2/kql/**'
      - 'sentinel_mesh_v2/data_simulator/upload_ready/**'
      - 'sentinel_mesh_v2/deployment/deploy_kql.py'

jobs:
  deploy:
    name: Execute KQL Deployer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-kusto-data

      - name: Deploy to Fabric Eventhouse
        env:
          EVENTHOUSE_CLUSTER_URI: ${{ secrets.EVENTHOUSE_CLUSTER_URI }}
          EVENTHOUSE_DATABASE: ${{ secrets.EVENTHOUSE_DATABASE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          python sentinel_mesh_v2/deployment/deploy_kql.py
